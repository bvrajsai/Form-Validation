<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Arithmetic Operations</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			padding: 32px;
			background: #f3f6fa;
			color: #1f2937;
			font-family: Arial, sans-serif;
		}

		.page {
			display: grid;
			grid-template-columns: minmax(280px, 420px) minmax(280px, 1fr);
			gap: 24px;
			width: min(100%, 900px);
			margin: 0 auto;
		}

		.panel {
			padding: 28px;
			border: 1px solid #dbe2ea;
			border-radius: 8px;
			background: #ffffff;
			box-shadow: 0 8px 24px rgba(31, 41, 55, 0.08);
		}

		h1,
		h2 {
			margin-top: 0;
			color: #111827;
		}

		h1 {
			margin-bottom: 8px;
			font-size: 28px;
		}

		h2 {
			margin-bottom: 20px;
			font-size: 22px;
		}

		.description {
			margin: 0 0 24px;
			color: #667085;
		}

		.field {
			margin-bottom: 16px;
		}

		label {
			display: block;
			margin-bottom: 6px;
			font-weight: 600;
		}

		input {
			width: 100%;
			padding: 11px 12px;
			border: 1px solid #cbd5e1;
			border-radius: 5px;
			font-size: 16px;
		}

		input:focus {
			border-color: #2563eb;
			outline: 2px solid rgba(37, 99, 235, 0.18);
		}

		.operations {
			display: grid;
			grid-template-columns: repeat(2, 1fr);
			gap: 10px;
			margin-top: 24px;
		}

		button {
			padding: 11px 14px;
			border: 0;
			border-radius: 5px;
			background: #2563eb;
			color: #ffffff;
			cursor: pointer;
			font-size: 15px;
			font-weight: 600;
		}

		button:hover {
			background: #1d4ed8;
		}

		.clear-button {
			width: 100%;
			margin-top: 16px;
			background: #64748b;
		}

		.clear-button:hover {
			background: #475569;
		}

		#message {
			min-height: 20px;
			margin: 16px 0 0;
			color: #b91c1c;
			text-align: center;
		}

		#stored-data {
			display: flex;
			flex-direction: column;
			gap: 10px;
			max-height: 430px;
			margin: 0;
			padding: 0;
			overflow-y: auto;
			list-style: none;
		}

		.stored-item,
		.empty-state {
			padding: 14px;
			border-radius: 5px;
			background: #f1f5f9;
		}

		.stored-item {
			display: flex;
			justify-content: space-between;
			gap: 12px;
		}

		.expression {
			color: #475569;
		}

		.result {
			color: #111827;
			font-weight: 700;
		}

		.empty-state {
			color: #64748b;
			text-align: center;
		}

		@media (max-width: 700px) {
			body {
				padding: 16px;
			}

			.page {
				grid-template-columns: 1fr;
			}
		}
	</style>
</head>
<body>
	<main class="page">
		<section class="panel" aria-labelledby="calculator-title">
			<h1 id="calculator-title">Arithmetic Operations</h1>
			<p class="description">Enter two numbers and choose an operation.</p>

			<div class="field">
				<label for="first-number">First number</label>
				<input type="number" id="first-number" step="any">
			</div>

			<div class="field">
				<label for="second-number">Second number</label>
				<input type="number" id="second-number" step="any">
			</div>

			<div class="operations">
				<button type="button" data-operation="add">Add</button>
				<button type="button" data-operation="subtract">Subtract</button>
				<button type="button" data-operation="divide">Divide</button>
				<button type="button" data-operation="multiply">Multiply</button>
			</div>

			<p id="message" role="status" aria-live="polite"></p>
		</section>

		<aside class="panel" aria-labelledby="stored-title">
			<h2 id="stored-title">Stored Data</h2>
			<ul id="stored-data"></ul>
			<button class="clear-button" type="button" id="clear-data">Clear stored data</button>
		</aside>
	</main>

	<script src="arthemetic.js"></script>
</body>
</html>
